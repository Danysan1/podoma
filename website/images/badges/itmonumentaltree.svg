<svg xmlns="http://www.w3.org/2000/svg" width="132.39" height="132.39" viewBox="0 0 35.028 35.028">
  <!-- Background circle split diagonally -->
  <path d="M17.514 0C7.842 0 0 7.842 0 17.514c0 4.927 2.003 9.387 5.24 12.615L30.491 4.878A17.449 17.449 0 0017.514 0" fill="#9ddff1"/>
  <path d="M30.491 4.878L5.24 30.129a17.449 17.449 0 0012.274 4.9c9.672 0 17.514-7.842 17.514-17.515 0-4.927-2.003-9.387-5.537-12.636" fill="#63c9e3"/>
  <!-- Monumental tree icon -->
  <g transform="translate(17.514,17.514)" fill="none">
    <!-- Trunk -->
    <path d="M-2.5,4 L-3,13 L3,13 L2.5,4 Z" fill="#6d4c41" stroke="#4e342e" stroke-width="0.4"/>
    <!-- Trunk bark lines -->
    <line x1="-0.5" y1="5" x2="-0.8" y2="12" stroke="#4e342e" stroke-width="0.3" opacity="0.5"/>
    <line x1="1" y1="5.5" x2="1.2" y2="12.5" stroke="#4e342e" stroke-width="0.3" opacity="0.5"/>
    <!-- Roots -->
    <path d="M-3,13 Q-5.5,13 -6,14" stroke="#6d4c41" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M3,13 Q5.5,13 6,14" stroke="#6d4c41" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M-1,13 Q-2,14 -3.5,14.5" stroke="#6d4c41" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M1,13 Q2,14 3.5,14.5" stroke="#6d4c41" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- Main canopy (large, majestic) -->
    <ellipse cx="0" cy="-4" rx="12" ry="10" fill="#388e3c" stroke="#2e7d32" stroke-width="0.5"/>
    <!-- Canopy shading layers -->
    <ellipse cx="-4" cy="-6" rx="6" ry="5.5" fill="#43a047" opacity="0.7"/>
    <ellipse cx="4" cy="-3" rx="7" ry="6" fill="#2e7d32" opacity="0.5"/>
    <ellipse cx="-2" cy="-2" rx="5" ry="4" fill="#4caf50" opacity="0.4"/>
    <!-- Highlight clusters -->
    <circle cx="-6" cy="-8" r="3" fill="#66bb6a" opacity="0.5"/>
    <circle cx="2" cy="-9" r="2.5" fill="#66bb6a" opacity="0.4"/>
    <circle cx="7" cy="-5" r="2" fill="#4caf50" opacity="0.4"/>
    <circle cx="-1" cy="-6" r="2" fill="#81c784" opacity="0.35"/>
    <!-- Small star/sparkle to denote "monumental" -->
    <g transform="translate(9,-10)" fill="#fdd835" stroke="#f9a825" stroke-width="0.2">
      <path d="M0,-2.5 L0.6,-0.8 L2.4,-0.8 L1,-0.1 L1.5,1.7 L0,0.7 L-1.5,1.7 L-1,-0.1 L-2.4,-0.8 L-0.6,-0.8 Z"/>
    </g>
  </g>
</svg>
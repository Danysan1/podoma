<svg xmlns="http://www.w3.org/2000/svg" width="132.39" height="132.39" viewBox="0 0 35.028 35.028">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="17.514" cy="17.514" r="17.514"/>
    </clipPath>
  </defs>
  <!-- Background circle: asphalt road -->
  <circle cx="17.514" cy="17.514" r="17.514" fill="#505050"/>
  <g clip-path="url(#circle-clip)">
    <g transform="translate(17.514,17.514)">
      <!-- Sidewalk area (right side) -->
      <rect x="2" y="-18" width="16" height="36" fill="#c8beb0"/>
      <!-- Curb edge -->
      <rect x="1" y="-18" width="1.5" height="36" fill="#9e9688"/>
      <!-- Tile grid lines - horizontal -->
      <line x1="2" y1="-14" x2="18" y2="-14" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="2" y1="-8" x2="18" y2="-8" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="2" y1="-2" x2="18" y2="-2" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="2" y1="4" x2="18" y2="4" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="2" y1="10" x2="18" y2="10" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="2" y1="16" x2="18" y2="16" stroke="#b0a696" stroke-width="0.3"/>
      <!-- Tile grid lines - vertical (offset pattern) -->
      <line x1="10" y1="-18" x2="10" y2="-14" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="6" y1="-14" x2="6" y2="-8" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="14" y1="-14" x2="14" y2="-8" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="10" y1="-8" x2="10" y2="-2" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="6" y1="-2" x2="6" y2="4" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="14" y1="-2" x2="14" y2="4" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="10" y1="4" x2="10" y2="10" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="6" y1="10" x2="6" y2="16" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="14" y1="10" x2="14" y2="16" stroke="#b0a696" stroke-width="0.3"/>
      <line x1="10" y1="16" x2="10" y2="18" stroke="#b0a696" stroke-width="0.3"/>
      <!-- Road marking - dashed center line -->
      <rect x="-10" y="-14" width="0.8" height="4" rx="0.2" fill="#e0e0e0" opacity="0.6"/>
      <rect x="-10" y="-6" width="0.8" height="4" rx="0.2" fill="#e0e0e0" opacity="0.6"/>
      <rect x="-10" y="2" width="0.8" height="4" rx="0.2" fill="#e0e0e0" opacity="0.6"/>
      <rect x="-10" y="10" width="0.8" height="4" rx="0.2" fill="#e0e0e0" opacity="0.6"/>
      <!-- Walking person silhouette on sidewalk -->
      <g transform="translate(9, -1)">
        <!-- Head -->
        <circle cx="0" cy="-5.5" r="1.5" fill="#5d5d5d"/>
        <!-- Body -->
        <line x1="0" y1="-4" x2="0" y2="2" stroke="#5d5d5d" stroke-width="1.2" stroke-linecap="round"/>
        <!-- Left arm -->
        <line x1="0" y1="-2.5" x2="-2.2" y2="0" stroke="#5d5d5d" stroke-width="1" stroke-linecap="round"/>
        <!-- Right arm -->
        <line x1="0" y1="-2.5" x2="2.2" y2="-0.5" stroke="#5d5d5d" stroke-width="1" stroke-linecap="round"/>
        <!-- Left leg -->
        <line x1="0" y1="2" x2="-1.8" y2="5.5" stroke="#5d5d5d" stroke-width="1" stroke-linecap="round"/>
        <!-- Right leg -->
        <line x1="0" y1="2" x2="1.8" y2="5.5" stroke="#5d5d5d" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
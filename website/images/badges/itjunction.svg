<svg xmlns="http://www.w3.org/2000/svg" width="132.39" height="132.39" viewBox="0 0 35.028 35.028">
  <defs>
    <clipPath id="circle-clip-junction">
      <circle cx="17.514" cy="17.514" r="17.514"/>
    </clipPath>
  </defs>
  <!-- Asphalt background circle -->
  <circle cx="17.514" cy="17.514" r="17.514" fill="#4a5560"/>
  <!-- Crossroads with a turn lane arrow -->
  <g clip-path="url(#circle-clip-junction)">
    <g transform="translate(17.514,17.514)">
      <!-- Horizontal road -->
      <rect x="-20" y="-4.5" width="40" height="9" fill="#6b6b6b"/>
      <!-- Vertical road -->
      <rect x="-4.5" y="-20" width="9" height="40" fill="#6b6b6b"/>
      <!-- Horizontal dashed center line -->
      <rect x="-20" y="-0.4" width="6" height="0.8" fill="#fff"/>
      <rect x="-11" y="-0.4" width="6" height="0.8" fill="#fff"/>
      <rect x="7" y="-0.4" width="6" height="0.8" fill="#fff"/>
      <rect x="16" y="-0.4" width="6" height="0.8" fill="#fff"/>
      <!-- Vertical dashed center line -->
      <rect x="-0.4" y="-20" width="0.8" height="6" fill="#fff"/>
      <rect x="-0.4" y="-11" width="0.8" height="6" fill="#fff"/>
      <rect x="-0.4" y="7" width="0.8" height="6" fill="#fff"/>
      <rect x="-0.4" y="16" width="0.8" height="6" fill="#fff"/>
      <!-- Turn lane arrow, curving from the south approach into the east exit -->
      <path d="M -1.6 12 L -1.6 3 Q -1.6 0 1.4 0 L 6 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 4.2 -1.6 L 7.4 0 L 4.2 1.6 Z" fill="#fff"/>
    </g>
  </g>
</svg>

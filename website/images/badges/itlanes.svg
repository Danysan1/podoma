<svg xmlns="http://www.w3.org/2000/svg" width="132.39" height="132.39" viewBox="0 0 35.028 35.028">
  <defs>
    <clipPath id="circle-clip-lanes">
      <circle cx="17.514" cy="17.514" r="17.514"/>
    </clipPath>
  </defs>
  <!-- Background circle split diagonally (same light blue as itshop.svg) -->
  <path d="M17.514 0C7.842 0 0 7.842 0 17.514c0 4.927 2.003 9.387 5.24 12.615L30.491 4.878A17.449 17.449 0 0017.514 0" fill="#9ddff1"/>
  <path d="M30.491 4.878L5.24 30.129a17.449 17.449 0 0012.274 4.9c9.672 0 17.514-7.842 17.514-17.515 0-4.927-2.003-9.387-5.537-12.636" fill="#63c9e3"/>
  <!-- Motorway exit: two lanes running straight, one lane leaving the carriageway, with lane-direction arrows painted at the start of each lane -->
  <g clip-path="url(#circle-clip-lanes)">
    <g transform="translate(17.514,17.514)">
      <!-- Three-lane approach carriageway -->
      <rect x="-7.5" y="4" width="15" height="12" fill="#6b6b6b"/>
      <!-- Lane dividers within the approach (dashed) -->
      <rect x="-2.9" y="4.5" width="0.8" height="2.5" fill="#fff"/>
      <rect x="-2.9" y="9" width="0.8" height="2.5" fill="#fff"/>
      <rect x="-2.9" y="13.5" width="0.8" height="2.5" fill="#fff"/>
      <rect x="2.1" y="4.5" width="0.8" height="2.5" fill="#fff"/>
      <rect x="2.1" y="9" width="0.8" height="2.5" fill="#fff"/>
      <rect x="2.1" y="13.5" width="0.8" height="2.5" fill="#fff"/>
      <!-- Two through lanes continuing straight -->
      <rect x="-7.5" y="-13" width="10" height="17" fill="#6b6b6b"/>
      <rect x="-2.9" y="-11" width="0.8" height="3" fill="#fff"/>
      <rect x="-2.9" y="-6" width="0.8" height="3" fill="#fff"/>
      <rect x="-2.9" y="-1" width="0.8" height="3" fill="#fff"/>
      <!-- Exit ramp lane peeling off to the right -->
      <path d="M 5 4 Q 5 -2 11 -6" fill="none" stroke="#6b6b6b" stroke-width="5" stroke-linecap="round"/>
      <!-- Lane-direction road markings, painted at the start of each lane -->
      <!-- Left through lane: straight arrow -->
      <g transform="translate(-5,10.1)">
        <rect x="-0.3" y="0" width="0.6" height="5.4" fill="#fff"/>
        <path d="M -1.3,0 L 1.3,0 L 0,-2.8 Z" fill="#fff"/>
      </g>
      <!-- Middle through lane: straight arrow -->
      <g transform="translate(0,10.1)">
        <rect x="-0.3" y="0" width="0.6" height="5.4" fill="#fff"/>
        <path d="M -1.3,0 L 1.3,0 L 0,-2.8 Z" fill="#fff"/>
      </g>
      <!-- Exit lane: elbow arrow bending 45 degrees toward the ramp, kept within the lane, head matches the straight arrows -->
      <path d="M 5,15.5 L 5,10.5 L 5.3,10.2" fill="none" stroke="#fff" stroke-width="0.6" stroke-linecap="round"/>
      <g transform="translate(5.3,10.2) rotate(45)">
        <path d="M -1.3,0 L 1.3,0 L 0,-2.8 Z" fill="#fff"/>
      </g>
    </g>
  </g>
</svg>

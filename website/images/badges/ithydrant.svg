<svg xmlns="http://www.w3.org/2000/svg" width="132.39" height="132.39" viewBox="0 0 35.028 35.028">
  <!-- Background circle split diagonally -->
  <path d="M17.514 0C7.842 0 0 7.842 0 17.514c0 4.927 2.003 9.387 5.24 12.615L30.491 4.878A17.449 17.449 0 0017.514 0" fill="#9ddff1"/>
  <path d="M30.491 4.878L5.24 30.129a17.449 17.449 0 0012.274 4.9c9.672 0 17.514-7.842 17.514-17.515 0-4.927-2.003-9.387-5.537-12.636" fill="#63c9e3"/>
  <!-- Fire hydrant icon -->
  <g transform="translate(17.514,17.514) scale(0.34)" fill="none">
    <!-- Main body -->
    <rect x="-8" y="-6" width="16" height="24" rx="2" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
    <!-- Top dome -->
    <path d="M-6,-6 Q-6,-14 0,-16 Q6,-14 6,-6" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
    <!-- Top cap -->
    <rect x="-3" y="-20" width="6" height="5" rx="1" fill="#c62828" stroke="#b71c1c" stroke-width="1.2"/>
    <!-- Top nut -->
    <polygon points="-2,-20 2,-20 1.5,-23 -1.5,-23" fill="#ef5350" stroke="#b71c1c" stroke-width="1"/>
    <!-- Pentagon nut on top -->
    <circle cx="0" cy="-24" r="2" fill="#d32f2f" stroke="#b71c1c" stroke-width="1"/>
    <!-- Left nozzle -->
    <rect x="-14" y="-2" width="7" height="6" rx="1.5" fill="#e53935" stroke="#b71c1c" stroke-width="1.2"/>
    <rect x="-16" y="-1" width="3" height="4" rx="1" fill="#c62828" stroke="#b71c1c" stroke-width="1"/>
    <!-- Right nozzle -->
    <rect x="7" y="-2" width="7" height="6" rx="1.5" fill="#e53935" stroke="#b71c1c" stroke-width="1.2"/>
    <rect x="13" y="-1" width="3" height="4" rx="1" fill="#c62828" stroke="#b71c1c" stroke-width="1"/>
    <!-- Horizontal bands -->
    <rect x="-9" y="-4" width="18" height="2" rx="0.5" fill="#b71c1c" opacity="0.5"/>
    <rect x="-9" y="4" width="18" height="2" rx="0.5" fill="#b71c1c" opacity="0.5"/>
    <rect x="-9" y="12" width="18" height="2" rx="0.5" fill="#b71c1c" opacity="0.5"/>
    <!-- Base -->
    <rect x="-12" y="18" width="24" height="4" rx="1" fill="#c62828" stroke="#b71c1c" stroke-width="1.2"/>
    <!-- Ground plate -->
    <rect x="-14" y="22" width="28" height="3" rx="1" fill="#b71c1c" stroke="#8e0000" stroke-width="1"/>
    <!-- Center bolt -->
    <circle cx="0" cy="1" r="3" fill="#b71c1c" stroke="#8e0000" stroke-width="1"/>
    <circle cx="0" cy="1" r="1.5" fill="#ef5350"/>
    <!-- Chain details on nozzles -->
    <circle cx="-16" cy="5" r="0.8" fill="#b71c1c"/>
    <circle cx="16" cy="5" r="0.8" fill="#b71c1c"/>
  </g>

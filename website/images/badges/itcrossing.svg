      <rect x="-10.4" y="-8" width="3.2" height="16" fill="#fff"/>
      <rect x="-4.8" y="-8" width="3.2" height="16" fill="#fff"/>
      <rect x="0.8" y="-8" width="3.2" height="16" fill="#fff"/>
      <rect x="6.4" y="-8" width="3.2" height="16" fill="#fff"/>
      <rect x="12" y="-8" width="3.2" height="16" fill="#fff"/>
    </g>
  </g>
</svg>
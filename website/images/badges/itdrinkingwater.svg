    <line x1="8.5" y1="3.5" x2="8.5" y2="10" stroke="#42a5f5" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="8" y1="3.8" x2="8" y2="9.5" stroke="#64b5f6" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
    <!-- Splash drops at bottom -->

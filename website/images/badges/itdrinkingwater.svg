    <path d="M8,11 L8.5,9 L9,11" fill="#4caf50" stroke="none"/>
    <path d="M-1,12 L-0.5,10 L0,12" fill="#4caf50" stroke="none"/>
    <!-- Pillar -->
    <rect x="-3" y="-6" width="6" height="18" rx="1" fill="#78909c" stroke="#546e7a" stroke-width="0.5"/>
    <!-- Pillar highlight -->
    <rect x="-2" y="-5.5" width="2" height="17" rx="0.5" fill="#90a4ae" opacity="0.5"/>
    <!-- Top cap -->
    <rect x="-4" y="-7" width="8" height="1.5" rx="0.5" fill="#607d8b" stroke="#455a64" stroke-width="0.4"/>

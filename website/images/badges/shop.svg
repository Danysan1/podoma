    <rect x="-11" y="-0.5" width="22" height="13.5" fill="#f5f0e8" stroke="#5d4037" stroke-width="0.4"/>
    <!-- Door -->
    <rect x="-2.5" y="4.5" width="5" height="8.5" rx="0.4" fill="#5d4037" stroke="#3e2723" stroke-width="0.35"/>

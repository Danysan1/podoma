    <path d="M-11,-4.5 L11,-4.5 L11,-0.5 Q9.2,-0.5 8.2,-3 Q7.2,-0.5 5.5,-0.5 Q3.8,-0.5 2.75,-3 Q1.7,-0.5 0,-0.5 Q-1.7,-0.5 -2.75,-3 Q-3.8,-0.5 -5.5,-0.5 Q-7.2,-0.5 -8.2,-3 Q-9.2,-0.5 -11,-0.5 Z" fill="#e65100" stroke="#bf360c" stroke-width="0.4"/>
    <!-- Awning stripe separators -->

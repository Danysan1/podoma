    <rect x="-1.5" y="5.5" width="3" height="3" rx="0.3" fill="#bbdefb" stroke="#3e2723" stroke-width="0.25"/>
    <!-- Left display window -->
    <rect x="-10" y="1.5" width="6.5" height="6" rx="0.3" fill="#bbdefb" stroke="#5d4037" stroke-width="0.35"/>
    <!-- Right display window -->
    <rect x="3.5" y="1.5" width="6.5" height="6" rx="0.3" fill="#bbdefb" stroke="#5d4037" stroke-width="0.35"/>
    <!-- Roof line -->
    <rect x="-11.5" y="-5" width="23" height="0.8" rx="0.3" fill="#5d4037" stroke="#3e2723" stroke-width="0.3"/>
    <!-- Sign board hanging -->
    <rect x="-4.5" y="-9.5" width="9" height="4" rx="0.6" fill="#5d4037" stroke="#3e2723" stroke-width="0.35"/>
    <!-- Sign bracket left -->
    <path d="M-4.5,-5.5 L-4.5,-5" stroke="#3e2723" stroke-width="0.6" stroke-linecap="round"/>
    <!-- Sign bracket right -->
    <path d="M4.5,-5.5 L4.5,-5" stroke="#3e2723" stroke-width="0.6" stroke-linecap="round"/>
